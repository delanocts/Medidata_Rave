[project]
name = "rave-testdata-agent"
version = "0.1.0"
description = "Config-driven multi-agent generator for metadata-conformant Medidata Rave test data"
requires-python = ">=3.11"
dependencies = [
  "rwslib==1.2.15",
  "requests>=2.32",
  "lxml>=5.0",
  "PyYAML>=6.0",
  "jsonschema>=4.20",
  "python-dotenv>=1.0",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = ["integration: talks to a live Rave instance; skipped by default"]
addopts = "-m 'not integration'"

[tool.setuptools.packages.find]
where = ["src"]
